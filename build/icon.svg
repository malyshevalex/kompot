<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Компот: плитка по сетке значков macOS (824×824, отступ 100), стакан ягодного компота, над ним пар фигурными скобками.
       Рисунок центрирован по своей рамке: от верха скобок (y≈224) до низа стакана (y≈846), центр 535. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7c7cfb"/><stop offset="0.55" stop-color="#5145e6"/><stop offset="1" stop-color="#3b2fc0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <radialGradient id="berry" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fda4af"/><stop offset="0.35" stop-color="#e11d48"/><stop offset="1" stop-color="#881337"/>
    </radialGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b0820" flood-opacity="0.3"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="glass"><path d="M330 446 L694 446 L660 800 Q656 834 622 834 L402 834 Q368 834 364 800 Z"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#drop)"/>
  <path d="M285 100h454a185 185 0 0 1 185 185v110c-138-55-275-77-412-77s-274 22-412 77V285A185 185 0 0 1 285 100z" fill="url(#gloss)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>

  <g transform="translate(512 512) scale(0.86) translate(-512 -535)">
    <!-- пар: каждая скобка отдельно и симметрично, без межбуквенного интервала -->
    <g font-family="'SF Mono', Menlo, 'JetBrains Mono', monospace" font-weight="700" font-size="190" fill="#ffffff" fill-opacity="0.92" text-anchor="middle">
      <text x="448" y="372">{</text>
      <text x="576" y="372">}</text>
    </g>
    <ellipse cx="512" cy="846" rx="200" ry="26" fill="#1e1680" opacity="0.45" filter="url(#soft)"/>
    <g clip-path="url(#glass)">
      <rect x="300" y="446" width="420" height="400" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="300" y="548" width="420" height="300" fill="url(#juice)"/>
      <ellipse cx="512" cy="550" rx="190" ry="16" fill="#ffffff" fill-opacity="0.38"/>
      <circle cx="452" cy="728" r="44" fill="url(#berry)"/>
      <circle cx="570" cy="760" r="38" fill="url(#berry)"/>
      <circle cx="590" cy="652" r="32" fill="url(#berry)"/>
      <circle cx="430" cy="630" r="24" fill="url(#berry)"/>
      <path d="M372 470 L392 800" stroke="#ffffff" stroke-opacity="0.35" stroke-width="18" stroke-linecap="round"/>
    </g>
    <path d="M330 446 L694 446 L660 800 Q656 834 622 834 L402 834 Q368 834 364 800 Z" fill="none" stroke="#ffffff" stroke-width="24" stroke-linejoin="round"/>
  </g>
</svg>
